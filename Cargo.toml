[workspace]
members = ["crates/*"]
resolver = "2"

[profile.test]
opt-level = 2

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiphysics"
documentation = "https://docs.rs/oxiphysics"
authors = ["COOLJAPAN OU (Team KitaSan)"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
rand = "0.10"
nalgebra = "0.35"
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
criterion = { version = "0.8", features = ["html_reports"] }
js-sys = "0.3.103"
proptest = "1"
numpy = "0.29.0"
pyo3 = "0.29"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3.76"
web-sys = { version = "0.3.103", features = ["console", "Window", "Performance"] }
rayon = "1"
wgpu = "30"
naga = "30"
bitvec = "1"
oxiarc-zstd = "0.4.2"
oxifft = "0.4.2"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4", features = ["wasm_js"] }
cudarc = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12080"] }

ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
scirs2-integrate = { version = "0.6.5" }

# Workspace-internal dependencies
oxiphysics-articulated = { path = "crates/oxiphysics-articulated", version = "0.1.3" }
oxiphysics-core = { path = "crates/oxiphysics-core", version = "0.1.3" }
oxiphysics-geometry = { path = "crates/oxiphysics-geometry", version = "0.1.3" }
oxiphysics-collision = { path = "crates/oxiphysics-collision", version = "0.1.3" }
oxiphysics-rigid = { path = "crates/oxiphysics-rigid", version = "0.1.3" }
oxiphysics-constraints = { path = "crates/oxiphysics-constraints", version = "0.1.3" }
oxiphysics-vehicle = { path = "crates/oxiphysics-vehicle", version = "0.1.3" }
oxiphysics-sph = { path = "crates/oxiphysics-sph", version = "0.1.3" }
oxiphysics-lbm = { path = "crates/oxiphysics-lbm", version = "0.1.3" }
oxiphysics-fem = { path = "crates/oxiphysics-fem", version = "0.1.3" }
oxiphysics-md = { path = "crates/oxiphysics-md", version = "0.1.3" }
oxiphysics-softbody = { path = "crates/oxiphysics-softbody", version = "0.1.3" }
oxiphysics-materials = { path = "crates/oxiphysics-materials", version = "0.1.3" }
oxiphysics-gpu = { path = "crates/oxiphysics-gpu", version = "0.1.3" }
oxiphysics-viz = { path = "crates/oxiphysics-viz", version = "0.1.3" }
oxiphysics-io = { path = "crates/oxiphysics-io", version = "0.1.3" }
oxiphysics = { path = "crates/oxiphysics", version = "0.1.3" }
oxiphysics-python = { path = "crates/oxiphysics-python", version = "0.1.3" }
oxiphysics-wasm = { path = "crates/oxiphysics-wasm", version = "0.1.3" }
